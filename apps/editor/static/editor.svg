<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450">
  <defs>
    <style>
      .cube-top   { fill: #b60e0c; }
      .cube-left  { fill: #8a0b09; }
      .cube-right { fill: #fbf6f6; }
      .bar        { fill: #b60e0c; }
      .k8s        { fill: #1d5eba; }
      .k8s-bg     { fill: #f8f9fc; }
      .label      { fill: #1c354c; }
    </style>
    <!-- Reusable isometric compute-node cube -->
    <g id="cube">
      <polygon class="cube-top"   points="0,-17 28,-6 0,5 -28,-6"/>
      <polygon class="cube-left"  points="-28,-6 0,5 0,23 -28,12"/>
      <polygon class="cube-right" points="28,-6 0,5 0,23 28,12"/>
    </g>
    <!-- Reusable helm-wheel spoke with paddle handle -->
    <g id="spoke">
      <rect class="k8s" x="-3" y="-47" width="6" height="33" rx="1"/>
      <circle class="k8s" cx="0" cy="-53" r="7"/>
    </g>
  </defs>

  <!-- =============================== -->
  <!-- Red frame — connecting bars      -->
  <!-- =============================== -->
  <g id="frame-bars">
    <!-- Top bars (TL↔TC, TC↔TR) -->
    <polygon class="bar" points="93,56 172,32 172,50 93,74"/>
    <polygon class="bar" points="228,32 307,56 307,74 228,50"/>
    <!-- Left vertical bars (TL↔ML, ML↔BL) -->
    <rect class="bar" x="56" y="78" width="18" height="92"/>
    <rect class="bar" x="56" y="200" width="18" height="96"/>
    <!-- Right vertical bars (TR↔MR, MR↔BR) -->
    <rect class="bar" x="326" y="78" width="18" height="92"/>
    <rect class="bar" x="326" y="200" width="18" height="96"/>
    <!-- Bottom bars (BL↔BC, BC↔BR) -->
    <polygon class="bar" points="93,304 172,328 172,346 93,322"/>
    <polygon class="bar" points="228,328 307,304 307,322 228,346"/>
  </g>

  <!-- =============================== -->
  <!-- 8 isometric compute-node cubes   -->
  <!-- =============================== -->
  <g id="compute-nodes">
    <use href="#cube" transform="translate(65,62)"/>
    <use href="#cube" transform="translate(200,38)"/>
    <use href="#cube" transform="translate(335,62)"/>
    <use href="#cube" transform="translate(65,185)"/>
    <use href="#cube" transform="translate(335,185)"/>
    <use href="#cube" transform="translate(65,310)"/>
    <use href="#cube" transform="translate(200,334)"/>
    <use href="#cube" transform="translate(335,310)"/>
  </g>

  <!-- =============================== -->
  <!-- Kubernetes helm wheel (7 spokes) -->
  <!-- =============================== -->
  <g id="k8s-wheel" transform="translate(200,185)">
    <circle class="k8s" r="62"/>
    <circle class="k8s-bg" r="50"/>
    <circle class="k8s" r="11"/>
    <use href="#spoke"/>
    <use href="#spoke" transform="rotate(51.43)"/>
    <use href="#spoke" transform="rotate(102.86)"/>
    <use href="#spoke" transform="rotate(154.29)"/>
    <use href="#spoke" transform="rotate(205.71)"/>
    <use href="#spoke" transform="rotate(257.14)"/>
    <use href="#spoke" transform="rotate(308.57)"/>
  </g>

  <!-- =============================== -->
  <!-- "Editor" label                   -->
  <!-- =============================== -->
  <text id="editor-label" x="200" y="418"
        text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="46" font-weight="bold" class="label">Editor</text>
</svg>
